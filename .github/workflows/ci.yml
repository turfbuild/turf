name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR branch).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive # materialize ./docker-agent for the replace directive
          fetch-depth: 0 # tags for `git describe` version injection (main.Version)

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod # single source of truth for the Go version
          # Caches the Go module cache (~/go/pkg/mod) and build cache
          # (~/.cache/go-build), keyed on go.sum — shared across jobs/runs.
          cache: true
          cache-dependency-path: go.sum

      - name: build
        run: make build

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./...

      - name: gofmt
        run: |
          unformatted=$(gofmt -l *.go)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive # golangci-lint compiles the package; needs ./docker-agent

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
