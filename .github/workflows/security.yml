# Continuous vulnerability / CVE scanning for the Turf CLI.
#
# Thin caller over the org-shared reusable workflow in turfbuild/.github, so the
# scanner set + pins stay in one place across the org. This is a PUBLIC repo, so
# results land in the GitHub code-scanning tab (SARIF upload). SAST is diff-gated
# on PRs (only newly-introduced gosec findings block).
name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 15 * * MON" # Mondays 15:00 UTC — matches the org cadence
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security:
    uses: turfbuild/.github/.github/workflows/security-scan.yml@main
    permissions:
      contents: read
      security-events: write # SARIF -> code-scanning tab (public repo)
    with:
      language: go
      has-submodules: true # ./docker-agent must resolve for the replace directive
      is-public: true
